name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Unit tests (no models)
        run: python -m unittest discover -s tests -v
      - name: Environment report
        run: python scripts/setup/check_env.py || true
      - name: Shell lint
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          find scripts examples -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: Shell syntax (system bash 3.2 on macOS)
        if: runner.os == 'macOS'
        run: find scripts examples -name '*.sh' -print0 | xargs -0 -n1 /bin/bash -n
      - name: No bash-4-only constructs
        run: |
          if grep -nE 'declare -A|mapfile|readarray|\$\{[A-Za-z_]+(,,|\^\^)\}|readlink -f' $(find scripts examples -name '*.sh'); then
            echo "bash 4+ construct found (macOS ships bash 3.2)"; exit 1
          fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
